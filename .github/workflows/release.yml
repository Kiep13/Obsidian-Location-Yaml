name: Release

on:
  push:
    tags:
      # Actions tag filters are globs; the job-level guard below is the
      # authoritative exact X.Y.Z/no-prefix check.
      - "*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Validate exact bare tag ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF" != "refs/tags/$GITHUB_REF_NAME" || ! "$GITHUB_REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release must run only for an X.Y.Z semver tag; received: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == "0.2.7" ]]; then
            echo "The historical 0.2.7 release is not eligible for workflow publication" >&2
            exit 1
          fi

      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify checkout provenance and cleanliness
        shell: bash
        run: |
          set -euo pipefail
          normalize_origin_url() {
            local url="$1"
            case "$url" in
              https://github.com/*|http://github.com/*)
                url="${url#*://github.com/}"
                ;;
              git@github.com:*)
                url="${url#git@github.com:}"
                ;;
              ssh://git@github.com/*)
                url="${url#ssh://git@github.com/}"
                ;;
              *)
                return 1
                ;;
            esac
            url="${url%/}"
            url="${url%.git}"
            printf '%s\n' "$url"
          }
          normalized_origin="$(normalize_origin_url "$(git remote get-url origin)")"
          test "$normalized_origin" = "$GITHUB_REPOSITORY"
          test -z "$(git status --porcelain --untracked-files=all)"
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          checked_out_target="$(git rev-parse --verify "$tag_ref^{}")"
          test "$checked_out_target" = "$(git rev-parse --verify HEAD^{commit})"

          remote_refs="$(git ls-remote --exit-code origin "$tag_ref" "$tag_ref^{}")"
          remote_target="$(awk -v ref="$tag_ref^{}" '$2 == ref { print $1; exit }' <<<"$remote_refs")"
          if [[ -z "$remote_target" ]]; then
            remote_target="$(awk -v ref="$tag_ref" '$2 == ref { print $1; exit }' <<<"$remote_refs")"
          fi
          test -n "$remote_target"
          test "$remote_target" = "$checked_out_target"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        shell: bash
        run: corepack pnpm run typecheck

      - name: Test
        shell: bash
        run: corepack pnpm run test

      - name: Lint
        shell: bash
        run: corepack pnpm run lint

      - name: Production build
        shell: bash
        run: corepack pnpm run build

      - name: Verify tracked bundle provenance after build
        shell: bash
        run: |
          set -euo pipefail
          node release.mjs provenance

      - name: Validate release assets and metadata
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm run release:validate -- "$GITHUB_REF_NAME"

      - name: Package BRAT ZIP
        shell: bash
        env:
          ZIP_PATH: artifacts/obsidian-location-${{ github.ref_name }}.zip
        run: |
          set -euo pipefail
          corepack pnpm run release:package -- "$GITHUB_REF_NAME" "$ZIP_PATH"
          test -s "$ZIP_PATH"

          mapfile -t zip_entries < <(unzip -Z1 "$ZIP_PATH")
          expected_entries=(main.js manifest.json styles.css)
          if [[ "$(printf '%s\n' "${zip_entries[@]}" | sort)" != "$(printf '%s\n' "${expected_entries[@]}" | sort)" ]]; then
            printf 'Unexpected ZIP root layout:\n%s\n' "${zip_entries[*]}" >&2
            exit 1
          fi

      - name: Create or update GitHub Release
        shell: bash
        env:
          ZIP_PATH: artifacts/obsidian-location-${{ github.ref_name }}.zip
          RELEASE_NOTES_PATH: docs/releases/${{ github.ref_name }}.md
        run: |
          set -euo pipefail
          test -s "$RELEASE_NOTES_PATH"
          release_assets=(main.js manifest.json styles.css "$ZIP_PATH")

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --notes-file "$RELEASE_NOTES_PATH" \
              --title "$GITHUB_REF_NAME" \
              --draft=false \
              --prerelease=false
          else
            gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --notes-file "$RELEASE_NOTES_PATH" \
              --title "$GITHUB_REF_NAME" \
              --draft=false \
              --prerelease=false
          fi

      - name: Verify published GitHub Release
        shell: bash
        env:
          ZIP_PATH: artifacts/obsidian-location-${{ github.ref_name }}.zip
          RELEASE_NOTES_PATH: docs/releases/${{ github.ref_name }}.md
          RELEASE_JSON: release-verification.json
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName,body,assets,isDraft,isPrerelease > "$RELEASE_JSON"

          test "$(jq -r '.tagName' "$RELEASE_JSON")" = "$GITHUB_REF_NAME"
          RELEASE_BODY_PATH="$(mktemp)"
          trap 'rm -f "$RELEASE_BODY_PATH"' EXIT
          jq -j '.body' "$RELEASE_JSON" > "$RELEASE_BODY_PATH"
          if ! cmp -s "$RELEASE_NOTES_PATH" "$RELEASE_BODY_PATH"; then
            echo "Published Release body differs byte-for-byte from authored notes" >&2
            exit 1
          fi
          test "$(jq -r '.isDraft' "$RELEASE_JSON")" = "false"
          test "$(jq -r '.isPrerelease' "$RELEASE_JSON")" = "false"

          mapfile -t release_asset_names < <(jq -r '.assets[].name' "$RELEASE_JSON")
          expected_release_assets=(main.js manifest.json styles.css "obsidian-location-${GITHUB_REF_NAME}.zip")
          if [[ "$(printf '%s\n' "${release_asset_names[@]}" | sort)" != "$(printf '%s\n' "${expected_release_assets[@]}" | sort)" ]]; then
            printf 'Unexpected published Release assets:\n%s\n' "${release_asset_names[*]}" >&2
            exit 1
          fi

          for asset in "${expected_release_assets[@]}"; do
            size="$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .size' "$RELEASE_JSON")"
            if ! [[ "$size" =~ ^[1-9][0-9]*$ ]]; then
              echo "Published Release asset is missing or empty: $asset" >&2
              exit 1
            fi
          done

          DOWNLOAD_DIR="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern 'main.js' --pattern 'manifest.json' --pattern 'styles.css' \
            --pattern "obsidian-location-${GITHUB_REF_NAME}.zip" --dir "$DOWNLOAD_DIR" --clobber
          for asset in main.js manifest.json styles.css; do
            test "$(sha256sum "$asset" | awk '{print $1}')" = \
              "$(sha256sum "$DOWNLOAD_DIR/$asset" | awk '{print $1}')"
          done
          zip_name="$(basename "$ZIP_PATH")"
          test "$(sha256sum "$ZIP_PATH" | awk '{print $1}')" = \
            "$(sha256sum "$DOWNLOAD_DIR/$zip_name" | awk '{print $1}')"
